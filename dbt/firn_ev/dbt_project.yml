name: 'firn_ev'
version: '1.0.0'
config-version: 2

profile: 'firn_ev'

# Folders dbt looks in
model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Materialisation defaults — see CLAUDE.md §5
models:
  firn_ev:
    +post-hook:
      - "grant select on {{ this }} to role FIRN_EV_DEV_OWNER"
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
      dimensions:
        +materialized: table
      facts:
        +materialized: table
      aggregates:
        +materialized: table

seeds:
  firn_ev:
    +schema: seed
    +quote_columns: false

# Project-wide variables — pulled from CLAUDE.md §2 (locked benchmarks)
vars:
  # AFIR (benchmark A)
  afir_kw_per_bev:                1.3
  afir_kw_per_phev:               0.8
  # NZ National EV Charging Strategy (benchmark B)
  nz_target_chargers_2030:        10000
  nz_chargers_per_ev_target_2030: 40
  nz_highway_legacy_km:           75
  nz_highway_current_km:          150
  # Time horizon
  analysis_start_year:            2018
  # NZ bounding box (sanity tests)
  nz_lat_min:                     -47.5
  nz_lat_max:                     -34.0
  nz_lon_min:                     166.0
  nz_lon_max:                     179.0
